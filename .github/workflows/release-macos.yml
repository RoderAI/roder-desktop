name: Build signed macOS desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "desktop/v*"

permissions:
  contents: write

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.5.0"
  APPLE_SIGNING_IDENTITY: "Developer ID Application: Pandelis Zembashis (7UNZ734ZYN)"
  R2_ACCOUNT_ID: "769befa385792ae6e7ca7136b7010256"
  R2_BUCKET: "roder-downloads"
  R2_PUBLIC_BASE_URL: "https://dl.roder.sh"

jobs:
  macos:
    name: Sign and notarize macOS arm64
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Select latest installed Xcode
        shell: bash
        run: |
          set -euo pipefail
          latest_xcode="$(python3 - <<'PY'
          from pathlib import Path

          candidates = [
              path
              for path in Path("/Applications").glob("Xcode*.app")
              if path.name != "Xcode.app"
          ]
          if not candidates:
              raise SystemExit("No versioned Xcode.app installations found")

          def version_key(path: Path):
              version = path.name.removeprefix("Xcode_").removesuffix(".app")
              version = version.replace("_Release_Candidate_", ".")
              parts = []
              for chunk in version.split("."):
                  try:
                      parts.append(int(chunk))
                  except ValueError:
                      parts.append(0)
              return parts

          print(max(candidates, key=version_key))
          PY
          )"
          sudo xcode-select -s "${latest_xcode}/Contents/Developer"
          xcodebuild -version

      - name: Cache Rust build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            roder-desktop-distro/target
          key: roder-desktop-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('roder-desktop-distro/Cargo.lock', 'roder-desktop-distro/Cargo.toml', 'roder-desktop-distro/src/**/*.rs') }}
          restore-keys: |
            roder-desktop-rust-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Import Apple signing assets
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARIZE_KEY_BASE64: ${{ secrets.APPLE_NOTARIZE_KEY_BASE64 }}
          APPLE_NOTARIZE_KEY_ID: ${{ secrets.APPLE_NOTARIZE_KEY_ID }}
          APPLE_NOTARIZE_ISSUER_ID: ${{ secrets.APPLE_NOTARIZE_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_NOTARIZE_KEY_BASE64 APPLE_NOTARIZE_KEY_ID APPLE_NOTARIZE_ISSUER_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "${name} secret is required for macOS signing and notarization" >&2
              exit 1
            fi
          done

          keychain_password="$(openssl rand -base64 32)"
          keychain_path="${RUNNER_TEMP}/roder-desktop-signing.keychain-db"
          certificate_path="${RUNNER_TEMP}/developer-id-application.p12"
          notary_key_path="${RUNNER_TEMP}/AuthKey_${APPLE_NOTARIZE_KEY_ID}.p8"

          echo "${APPLE_CERTIFICATE_BASE64}" | base64 --decode > "${certificate_path}"
          echo "${APPLE_NOTARIZE_KEY_BASE64}" | base64 --decode > "${notary_key_path}"
          chmod 600 "${certificate_path}" "${notary_key_path}"

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -k "${keychain_path}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychains -d user -s "${keychain_path}" $(security list-keychains -d user | sed 's/[ "]//g')
          security default-keychain -s "${keychain_path}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${keychain_password}" "${keychain_path}"

          {
            echo "CSC_KEYCHAIN=${keychain_path}"
            echo "APPLE_NOTARIZE_KEY_PATH=${notary_key_path}"
            echo "APPLE_NOTARIZE_KEY_ID=${APPLE_NOTARIZE_KEY_ID}"
            echo "APPLE_NOTARIZE_ISSUER_ID=${APPLE_NOTARIZE_ISSUER_ID}"
            echo "RODER_DESKTOP_MACOS_SIGN=1"
          } >> "${GITHUB_ENV}"

      - name: Build signed notarized app
        shell: bash
        run: |
          set -euo pipefail
          pnpm typecheck
          RODER_DESKTOP_MACOS_SIGN=0 pnpm exec electron-forge package --platform darwin --arch arm64
          app=""
          for _ in {1..30}; do
            app="$(find "${GITHUB_WORKSPACE}" -type d -name 'Roder.app' -print -quit 2>/dev/null || true)"
            if [[ -n "${app}" ]]; then
              break
            fi
            sleep 1
          done
          if [[ -z "${app}" ]]; then
            echo "electron-forge did not leave a Roder.app; packaging explicitly with electron-packager" >&2
            packager_out="${RUNNER_TEMP}/roder-desktop-packager-out"
            rm -rf "${packager_out}"
            pnpm exec electron-packager . Roder \
              --platform=darwin \
              --arch=arm64 \
              --out="${packager_out}" \
              --overwrite \
              --executable-name=Roder \
              --app-bundle-id=sc.roder.desktop \
              --app-category-type=public.app-category.developer-tools \
              --icon=resources/icon \
              --asar.unpack='**/node_modules/node-pty/**' \
              --extra-resource=resources/bin \
              --extra-resource=resources/icon.png \
              --extra-resource=resources/wordmark.png \
              --ignore='^/out($|/)' \
              --ignore='^/\\.git($|/)' \
              --ignore='^/\\.github($|/)' \
              --ignore='^/roder-desktop-distro/target($|/)' \
              --no-prune
            for _ in {1..120}; do
              app="$(find "${packager_out}" -type d -name 'Roder.app' -print -quit 2>/dev/null || true)"
              if [[ -n "${app}" ]]; then
                break
              fi
              sleep 1
            done
            if [[ -z "${app}" ]]; then
              echo "Roder.app was not produced under ${GITHUB_WORKSPACE}" >&2
              find "${packager_out}" -maxdepth 6 -print >&2 || true
              find "${GITHUB_WORKSPACE}" -maxdepth 6 -print >&2
              exit 1
            fi
          fi

          pnpm exec electron-osx-sign "${app}" \
            --identity="${APPLE_SIGNING_IDENTITY}" \
            --keychain="${CSC_KEYCHAIN}" \
            --platform=darwin \
            --type=distribution \
            --hardened-runtime \
            --strictVerify
          codesign --verify --deep --strict --verbose=2 "${app}"
          echo "RODER_DESKTOP_APP_PATH=${app}" >> "${GITHUB_ENV}"

      - name: Prepare signed release artifacts
        shell: bash
        run: |
          set -euo pipefail
          app="${RODER_DESKTOP_APP_PATH:-}"
          if [[ -z "${app}" ]]; then
            echo "RODER_DESKTOP_APP_PATH was not exported by the build step" >&2
            find "${GITHUB_WORKSPACE}" -maxdepth 6 -print >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "${app}"
          codesign -dvvv --entitlements :- "${app}"

          app_submission="${RUNNER_TEMP}/Roder.app.zip"
          ditto -c -k --keepParent "${app}" "${app_submission}"
          xcrun notarytool submit "${app_submission}" \
            --key "${APPLE_NOTARIZE_KEY_PATH}" \
            --key-id "${APPLE_NOTARIZE_KEY_ID}" \
            --issuer "${APPLE_NOTARIZE_ISSUER_ID}" \
            --wait
          xcrun stapler staple "${app}"
          xcrun stapler validate "${app}"

          mkdir -p dist
          ditto -c -k --keepParent "${app}" dist/Roder-macos-arm64.zip

          dmg="dist/Roder-macos-arm64.dmg"
          rm -f "${dmg}"
          hdiutil create \
            -volname "Roder" \
            -srcfolder "${app}" \
            -ov \
            -format UDZO \
            "${dmg}"

          codesign --force \
            --sign "${APPLE_SIGNING_IDENTITY}" \
            --timestamp \
            --keychain "${CSC_KEYCHAIN}" \
            "${dmg}"
          xcrun notarytool submit "${dmg}" \
            --key "${APPLE_NOTARIZE_KEY_PATH}" \
            --key-id "${APPLE_NOTARIZE_KEY_ID}" \
            --issuer "${APPLE_NOTARIZE_ISSUER_ID}" \
            --wait
          xcrun stapler staple "${dmg}"
          codesign --verify --verbose=2 "${dmg}"
          xcrun stapler validate "${dmg}"

          (
            cd dist
            shasum -a 256 Roder-macos-arm64.dmg Roder-macos-arm64.zip > SHA256SUMS
          )

      - name: Validate signed artifacts
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s dist/Roder-macos-arm64.zip || ! -s dist/Roder-macos-arm64.dmg ]]; then
            echo "Expected release artifacts are missing from dist/" >&2
            find dist -maxdepth 2 -print >&2
            exit 1
          fi

          (
            cd dist
            shasum -a 256 -c SHA256SUMS
          )

      - name: Publish artifacts to Cloudflare R2
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${R2_ACCESS_KEY_ID:-}" || -z "${R2_SECRET_ACCESS_KEY:-}" ]]; then
            if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
              echo "R2 credentials are not configured; skipping R2 publish." >&2
              exit 0
            fi
          fi
          bash scripts/publish-desktop-r2.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: roder-desktop-macos-arm64
          path: dist/*
          if-no-files-found: error

      - name: Upload artifacts to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" --title "${tag}" --notes "Roder Desktop ${tag}"
          fi
          gh release upload "${tag}" dist/* --clobber
